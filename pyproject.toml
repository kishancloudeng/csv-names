[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-names"
version = "0.1.0"
description = "Read people records from CSV files: a small library and CLI."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
keywords = ["csv", "cli", "names"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]

[project.scripts]
csv-names = "csv_names.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
csv_names = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
